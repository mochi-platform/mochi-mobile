<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script></head><body><div data-status="9:41"></div>
<div class="screen" style="display:flex;flex-direction:column">
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;margin-top:-10px">
    <div style="position:relative">
      <div class="glow" style="width:260px;height:200px;left:-40px;top:0;background:radial-gradient(closest-side,#FBDDE2,#F3E6F6 60%,transparent)"></div>
      <div data-mochi="excited" data-size="200" style="position:relative"></div>
    </div>
    <div class="bubble up" style="margin-top:14px;width:100%">
      <div class="quote" style="font-size:21px">¡Hola! Soy Mochi.<br>Antes de empezar, ¿vienes por ti o te invitó tu pareja?</div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:56px">
    <div class="surface lift" style="display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;outline:2.5px solid var(--accent)">
      <div class="tile" style="background:var(--t-me);color:var(--t-me-i);width:48px;height:48px;font-size:24px"><ion-icon name="sparkles"></ion-icon></div>
      <div style="flex:1"><b style="font-size:17px;font-weight:800">Vengo por mí</b><div class="muted" style="font-size:13.5px">Estudio, hábitos, ciclo y más, a mi ritmo</div></div>
      <div style="width:24px;height:24px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff"><ion-icon name="checkmark" style="font-size:16px"></ion-icon></div>
    </div>
    <div class="surface" style="display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px">
      <div class="tile" style="background:var(--t-duo);color:var(--t-duo-i);width:48px;height:48px;font-size:24px"><ion-icon name="heart"></ion-icon></div>
      <div style="flex:1"><b style="font-size:17px;font-weight:800">Me invitó mi pareja</b><div class="muted" style="font-size:13.5px">Tengo un código de Mochi Duo</div></div>
      <div style="width:24px;height:24px;border-radius:50%;border:2.5px solid #e3d6d6"></div>
    </div>
    <div class="btn primary" style="margin-top:6px">Continuar</div>
  </div>
</div>
<div class="home-ind"></div><script src="mochi.js"></script><script src="common.js"></script></body></html>
