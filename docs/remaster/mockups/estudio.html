<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script></head><body><div data-status="9:41"></div>
<div class="screen">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
    <h1 class="display">Estudio</h1>
    <div style="width:44px;height:44px;border-radius:16px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:26px;box-shadow:0 8px 18px rgba(185,115,159,.35)"><ion-icon name="add"></ion-icon></div>
  </div>

  <div style="display:flex;justify-content:space-between;margin-top:16px"><div style='width:44px;padding:8px 0;border-radius:16px;text-align:center'><div class='muted' style='font-size:11px;font-weight:800'>L</div><div style='font-family:Fredoka;font-size:18px'>26</div></div><div style='width:44px;padding:8px 0;border-radius:16px;text-align:center'><div class='muted' style='font-size:11px;font-weight:800'>M</div><div style='font-family:Fredoka;font-size:18px'>27</div></div><div style='width:44px;padding:8px 0;border-radius:16px;background:var(--ink);color:#fff;text-align:center'><div style='font-size:11px;font-weight:800;opacity:.7'>X</div><div style='font-family:Fredoka;font-size:18px'>28</div></div><div style='width:44px;padding:8px 0;border-radius:16px;text-align:center'><div class='muted' style='font-size:11px;font-weight:800'>J</div><div style='font-family:Fredoka;font-size:18px'>29</div></div><div style='width:44px;padding:8px 0;border-radius:16px;text-align:center'><div class='muted' style='font-size:11px;font-weight:800'>V</div><div style='font-family:Fredoka;font-size:18px'>30</div><div style='width:5px;height:5px;border-radius:50%;background:var(--t-me-i);margin:2px auto 0'></div></div><div style='width:44px;padding:8px 0;border-radius:16px;text-align:center'><div class='muted' style='font-size:11px;font-weight:800'>S</div><div style='font-family:Fredoka;font-size:18px'>31</div></div><div style='width:44px;padding:8px 0;border-radius:16px;text-align:center'><div class='muted' style='font-size:11px;font-weight:800'>D</div><div style='font-family:Fredoka;font-size:18px'>1</div></div></div>
  <div class="surface lift" style="margin-top:14px;padding:20px;border-radius:28px;background:linear-gradient(150deg,#fff 45%,#EFE6F9)">
    <div style="display:flex;gap:12px;align-items:center">
      <div style="flex:1;min-width:0">
        <div class="eyebrow">Ahora · 09:00</div>
        <div style="font-family:Fredoka;font-weight:600;font-size:25px;margin-top:6px;line-height:1.1">Lógica matemática</div>
        <div class="muted" style="font-weight:700;margin-top:4px">45 min · Capítulo 3</div>
      </div>
      <div data-mochi="focused" data-size="86" data-shadow="false" style="flex:none"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px"><span class="pill primary" style="padding:12px 20px"><ion-icon name="play"></ion-icon>Empezar</span><span class="pill soft" style="padding:12px 16px">Posponer</span></div>
  </div>

  <div class="section-h"><h2 class="title">Tarjetas para hoy</h2><a>Mazos</a></div>
  <div style="display:flex;gap:12px">
    <div class="surface" style="flex:1;padding:14px"><div class="tile" style="background:var(--t-me);color:var(--t-me-i)"><ion-icon name="layers"></ion-icon></div><b style="display:block;margin-top:10px;font-weight:800">Biología</b><small class="muted" style="font-weight:700">12 por repasar</small></div>
    <div class="surface" style="flex:1;padding:14px"><div class="tile" style="background:var(--t-study);color:var(--t-study-i)"><ion-icon name="layers"></ion-icon></div><b style="display:block;margin-top:10px;font-weight:800">Inglés B2</b><small class="muted" style="font-weight:700">Al día</small></div>
  </div>

  <div class="section-h"><h2 class="title">Exámenes</h2></div>
  <div class="surface list">
    <div class="row"><div style="width:44px;text-align:center;flex:none"><div style="font-family:Fredoka;font-size:22px;color:var(--t-me-i);line-height:1">2</div><div class="muted" style="font-size:11px;font-weight:800">días</div></div><div class="t"><b>Biología</b><small>Viernes 30 · preparación 60%</small></div><ion-icon name="chevron-forward" class="chev"></ion-icon></div>
  </div>
</div>
<div data-tabbar="hoy,estudio,cocina,yo,duo:estudio"></div>
<div class="home-ind"></div><script src="mochi.js"></script><script src="common.js"></script></body></html>
