<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script></head><body><div data-status="9:41"></div>
<div class="screen">
  <h1 class="display" style="margin-top:10px">Cocina</h1>
  <div class="surface lift" style="margin-top:16px;padding:16px 18px;display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#FFF5EC,#FDE6D6)">
    <div data-mochi="excited" data-size="74" data-shadow="false" style="flex:none"></div>
    <div style="flex:1"><div class="quote" style="font-size:17px">¿Qué hay en tu refri? Te armo una receta con eso.</div>
      <div class="pill" style="background:var(--t-kitchen-i);color:#fff;margin-top:10px;padding:8px 14px"><ion-icon name="sparkles"></ion-icon>Crear receta</div></div>
  </div>

  <div class="section-h"><h2 class="title">Tus recetas</h2><a>Ver todas</a></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div class="surface" style="overflow:hidden">
      <div style="height:104px;background:linear-gradient(140deg,#F9D3B4,#F2B48E);display:grid;place-items:center;color:#fff;font-size:44px"><ion-icon name="restaurant"></ion-icon></div>
      <div style="padding:10px 12px 12px"><b style="font-weight:800;display:block">Lasaña de pollo</b><small class="muted" style="font-weight:700;display:flex;gap:4px;align-items:center;margin-top:3px"><ion-icon name="time-outline"></ion-icon>50 min · Media</small></div>
    </div>
    <div class="surface" style="overflow:hidden">
      <div style="height:104px;background:linear-gradient(140deg,#E3EFD9,#C5DEB5);display:grid;place-items:center;color:#fff;font-size:44px"><ion-icon name="leaf"></ion-icon></div>
      <div style="padding:10px 12px 12px"><b style="font-weight:800;display:block">Ensalada tibia</b><small class="muted" style="font-weight:700;display:flex;gap:4px;align-items:center;margin-top:3px"><ion-icon name="time-outline"></ion-icon>15 min · Fácil</small></div>
    </div>
  </div>

  <div class="section-h"><h2 class="title">Para esta semana</h2></div>
  <div class="surface list">
    <div class="row"><div class="tile" style="background:var(--t-kitchen);color:var(--t-kitchen-i)"><ion-icon name="cart"></ion-icon></div><div class="t"><b>Lista de compras</b><small>9 ingredientes</small></div><ion-icon name="chevron-forward" class="chev"></ion-icon></div>
  </div>
</div>
<div data-tabbar="hoy,cocina,yo:cocina"></div>
<div class="home-ind"></div><script src="mochi.js"></script><script src="common.js"></script></body></html>
