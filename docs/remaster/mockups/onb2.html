<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script></head><body><div data-status="9:41"></div>
<div class="screen" style="display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:12px;margin-top:8px">
    <ion-icon name="chevron-back" style="font-size:24px;color:var(--muted)"></ion-icon>
    <div style="flex:1;display:flex;gap:6px">
      <div style="flex:1;height:6px;border-radius:3px;background:var(--accent)"></div><div style="flex:1;height:6px;border-radius:3px;background:var(--accent)"></div><div style="flex:1;height:6px;border-radius:3px;background:var(--accent)"></div><div style="flex:1;height:6px;border-radius:3px;background:#EADFDA"></div><div style="flex:1;height:6px;border-radius:3px;background:#EADFDA"></div>
    </div>
  </div>
  <div style="display:flex;align-items:flex-end;gap:10px;margin-top:26px">
    <div data-mochi="thinking" data-size="96" data-shadow="false" style="flex:none;margin-bottom:-4px"></div>
    <div class="bubble left" style="flex:1"><div class="quote" style="font-size:18px">Me encanta, Domi. ¿Qué quieres cuidar conmigo?</div></div>
  </div>
  <p class="muted" style="margin:20px 4px 12px;font-weight:700">Elige todo lo que quieras. Lo puedes cambiar después.</p>
  <div style="display:flex;flex-wrap:wrap;gap:10px">
    <div class="chip on"><ion-icon name="book"></ion-icon>Mis estudios</div>
    <div class="chip on"><ion-icon name="school"></ion-icon>Mis exámenes</div>
    <div class="chip"><ion-icon name="leaf" style="color:var(--t-ok-i)"></ion-icon>Mis hábitos</div>
    <div class="chip on"><ion-icon name="water"></ion-icon>Mi ciclo</div>
    <div class="chip"><ion-icon name="happy" style="color:var(--t-me-i)"></ion-icon>Cómo me siento</div>
    <div class="chip"><ion-icon name="barbell" style="color:var(--t-study-i)"></ion-icon>Moverme más</div>
    <div class="chip on"><ion-icon name="restaurant"></ion-icon>Comer rico</div>
    <div class="chip"><ion-icon name="heart" style="color:var(--t-duo-i)"></ion-icon>Mi relación</div>
  </div>
  <div class="sunken" style="margin-top:22px;padding:14px 16px;display:flex;gap:12px;align-items:center">
    <ion-icon name="sparkles" style="color:var(--accent);font-size:22px"></ion-icon>
    <div style="font-size:14px;font-weight:700">Tu inicio tendrá <b style="font-weight:800">Estudio, Ciclo y Cocina</b>. Nada más, para que no te abrume.</div>
  </div>
  <div style="flex:1"></div>
  <div class="btn primary" style="margin-bottom:56px">Continuar</div>
</div>
<div class="home-ind"></div><script src="mochi.js"></script><script src="common.js"></script></body></html>
