<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=block" rel="stylesheet">
<style>body{margin:0;background:#FBF6EF;font-family:Nunito;color:#3A2A2E}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:28px}
.c{display:flex;flex-direction:column;align-items:center;background:#fff;border-radius:28px;padding:18px 8px 14px;box-shadow:0 1px 2px rgba(90,47,47,.05),0 10px 30px rgba(90,47,47,.07)}
.c b{font-family:Fredoka;font-weight:600;font-size:17px;margin-top:6px}
h1{font-family:Fredoka;font-weight:600;margin:28px 28px 0;font-size:30px}
p{margin:4px 28px 0;color:#8A7479;font-weight:700}
.ref{display:flex;gap:20px;align-items:center}
</style></head><body>
<h1>Mochi vectorial</h1><p>Izquierda: PNG original · El resto: dibujada en código (animable)</p>
<div class="g">
<div class="c"><img src="ref.png" width="150"><b>PNG original</b></div>
<div class="c"><div data-mochi="happy" data-size="150"></div><b>happy</b></div>
<div class="c"><div data-mochi="excited" data-size="150"></div><b>excited</b></div>
<div class="c"><div data-mochi="thinking" data-size="150"></div><b>thinking</b></div>
<div class="c"><div data-mochi="sleepy" data-size="150"></div><b>sleepy</b></div>
<div class="c"><div data-mochi="proud" data-size="150"></div><b>proud</b></div>
<div class="c"><div data-mochi="worried" data-size="150"></div><b>worried</b></div>
<div class="c"><div data-mochi="celebrating" data-size="150"></div><b>celebrating</b></div>
<div class="c"><div data-mochi="tired" data-size="150"></div><b>tired</b></div>
<div class="c"><div data-mochi="focused" data-size="150"></div><b>focused</b></div>
<div class="c"><div data-mochi="soft_sad" data-size="150"></div><b>soft_sad</b></div>
<div class="c"><div data-mochi="love" data-size="150"></div><b>love (nuevo)</b></div>
</div><script src="mochi.js"></script></body></html>
