<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script></head><body><div data-status="9:41"></div>
<div class="screen" style="display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:12px;margin-top:8px">
    <ion-icon name="chevron-back" style="font-size:24px;color:var(--muted)"></ion-icon>
    <div style="flex:1;display:flex;gap:6px"><div style="flex:1;height:6px;border-radius:3px;background:var(--accent)"></div><div style="flex:1;height:6px;border-radius:3px;background:var(--accent)"></div><div style="flex:1;height:6px;border-radius:3px;background:#EADFDA"></div></div>
  </div>
  <div style="display:flex;justify-content:center;margin-top:30px;gap:0;align-items:flex-end">
    <div data-mochi="love" data-size="150"></div>
  </div>
  <h1 class="display" style="text-align:center;font-size:27px;margin-top:10px">Esteban, únete a Domi</h1>
  <p class="quote muted" style="text-align:center;font-size:17px;margin:8px 10px 0">Escribe el código que te compartió. Así podrán verse, mandarse notas y regalarse vales.</p>
  <div style="display:flex;gap:8px;justify-content:center;margin-top:26px">
    <div class="surface" style="width:46px;height:58px;border-radius:16px;display:grid;place-items:center;font-family:Fredoka;font-size:26px">M</div>
    <div class="surface" style="width:46px;height:58px;border-radius:16px;display:grid;place-items:center;font-family:Fredoka;font-size:26px">7</div>
    <div class="surface" style="width:46px;height:58px;border-radius:16px;display:grid;place-items:center;font-family:Fredoka;font-size:26px">K</div>
    <div class="surface" style="width:46px;height:58px;border-radius:16px;display:grid;place-items:center;font-family:Fredoka;font-size:26px;outline:2.5px solid var(--accent)">2</div>
    <div class="surface" style="width:46px;height:58px;border-radius:16px"></div>
    <div class="surface" style="width:46px;height:58px;border-radius:16px"></div>
  </div>
  <div class="pill soft" style="align-self:center;margin-top:18px"><ion-icon name="qr-code"></ion-icon>Escanear su QR</div>
  <div style="flex:1"></div>
  <div class="sunken" style="padding:13px 16px;display:flex;gap:12px;align-items:center;margin-bottom:12px">
    <ion-icon name="lock-closed" style="color:var(--muted);font-size:20px"></ion-icon>
    <div style="font-size:13px;font-weight:700" class="muted">Solo verás lo que Domi decida compartir contigo.</div>
  </div>
  <div class="btn primary" style="margin-bottom:56px">Unirme</div>
</div>
<div class="home-ind"></div><script src="mochi.js"></script><script src="common.js"></script></body></html>
