<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script></head><body><div data-status="9:41"></div>
<div class="screen">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
    <h1 class="display">Duo</h1>
    <div style="display:flex"><div class="avatar" style="background:var(--t-me);color:var(--t-me-i);border:3px solid var(--canvas)">D</div><div class="avatar" style="background:var(--t-study);color:var(--t-study-i);border:3px solid var(--canvas);margin-left:-12px">E</div></div>
  </div>

  <div class="surface lift" style="margin-top:16px;padding:18px;display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#FFF 40%,#F8E9F1)">
    <div style="flex:none"><span data-face="4" data-size="54"></span></div>
    <div style="flex:1"><div class="eyebrow">Esteban hoy</div><b style="font-size:17px;font-weight:800;display:block;margin-top:2px">Contento</b>
      <div class="quote" style="font-size:15.5px;margin-top:4px">"Te espero con café después de tu examen"</div></div>
  </div>

  <div class="section-h"><h2 class="title">Notas</h2><a>Escribir</a></div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <div style="align-self:flex-start;max-width:78%;background:#fff;border-radius:20px 20px 20px 6px;padding:11px 14px;box-shadow:var(--sh1);font-weight:700">Mucha suerte hoy, tú puedes</div>
    <div style="align-self:flex-end;max-width:78%;background:var(--accent);color:#fff;border-radius:20px 20px 6px 20px;padding:11px 14px;font-weight:700">Gracias, mi amor. Salgo a las 11</div>
  </div>

  <div class="section-h"><h2 class="title">Vales</h2><a>Ver todos</a></div>
  <div style="display:flex;gap:18px;overflow:hidden;margin:0 -20px;padding:4px 20px 8px">
    <div style="flex:none;width:200px;height:118px;border-radius:22px;background:linear-gradient(140deg,#F7C6D3,#E7C6E8);padding:14px;position:relative;box-shadow:var(--sh1)">
            <div style="position:absolute;left:-9px;top:50%;margin-top:-9px;width:18px;height:18px;border-radius:50%;background:var(--canvas)"></div>
      <div class="eyebrow" style="color:#9c5a85">De Esteban</div>
      <div style="font-family:Fredoka;font-weight:600;font-size:19px;margin-top:6px;line-height:1.15">Una cena sin celulares</div>
      <div style="position:absolute;bottom:12px;left:14px;font-size:12.5px;font-weight:800;color:#9c5a85">Canjear</div>
    </div>
    <div style="flex:none;width:200px;height:118px;border-radius:22px;background:linear-gradient(140deg,#FCE3CF,#F9D3C4);padding:14px;position:relative;box-shadow:var(--sh1)">
      <div style="position:absolute;left:-9px;top:50%;margin-top:-9px;width:18px;height:18px;border-radius:50%;background:var(--canvas)"></div>
      <div class="eyebrow" style="color:#b0623a">De Esteban</div>
      <div style="font-family:Fredoka;font-weight:600;font-size:19px;margin-top:6px;line-height:1.15">Masaje de 15 minutos</div>
    </div>
  </div>

  <div class="section-h" style="margin-top:14px"><h2 class="title">Metas juntos</h2></div>
  <div class="surface list">
    <div class="row"><div class="tile" style="background:var(--t-kitchen);color:var(--t-kitchen-i)"><ion-icon name="airplane"></ion-icon></div><div class="t"><b>Viaje a Baños</b><small>$140 de $300</small></div><div class="end">47%</div></div>
  </div>
</div>
<div data-tabbar="hoy,estudio,cocina,yo,duo:duo"></div>
<div class="home-ind"></div><script src="mochi.js"></script><script src="common.js"></script></body></html>
